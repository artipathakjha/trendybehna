name: pinterest-token

# Keeps Pinterest connected with nobody touching it. Pinterest access tokens last 30 days and its refresh tokens are
# "continuous": every refresh returns a NEW refresh token and the old one stops working. So every week this job
# swaps the refresh token for a fresh pair and saves BOTH as secrets. If saving ever fails after a refresh, the chain
# breaks and Pinterest has to be connected again, so the save permission is proven BEFORE refreshing.
# First connection: open the consent link (README, "Pinterest"), copy the `code` from the address it lands on, then
# Actions -> pinterest-token -> Run workflow, paste it into "code". The code works once, for a few minutes, and is
# useless without PINTEREST_APP_SECRET, so its appearance in this public log is harmless.
# Tokens are written to files and piped into `gh secret set`; they never appear in this (public) log.
on:
  schedule:
    - cron: "41 3 * * 0"   # Sundays 09:11 IST
  workflow_dispatch:
    inputs:
      code:
        description: "First connection only: the one-time code from the Pinterest consent redirect"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pinned to commit SHAs: this job holds the Pinterest app secret and a secrets-write token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Connected yet? (until the first connection, the weekly run does nothing and stays green)
        id: c
        env:
          HAVE_REFRESH: ${{ secrets.PINTEREST_REFRESH_TOKEN != '' }}
          HAVE_CODE: ${{ inputs.code != '' }}
        run: |
          if [ "$HAVE_REFRESH" = true ] || [ "$HAVE_CODE" = true ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "Pinterest is not connected yet; nothing to do"; fi
      - run: pip install -r requirements.txt
        if: steps.c.outputs.go == 'true'
      - name: Can we save secrets? (checked before refreshing, so a refresh is never thrown away)
        if: steps.c.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: gh secret list --repo "${GITHUB_REPOSITORY}" > /dev/null || { echo "::error::SECRETS_PAT is missing or cannot manage secrets; nothing refreshed"; exit 1; }
      # Separate steps so the Python process that talks to Pinterest never has the secrets-write token.
      - name: Get new Pinterest tokens
        if: steps.c.outputs.go == 'true'
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_CODE: ${{ inputs.code }}
          PINTEREST_SANDBOX: ${{ vars.PINTEREST_SANDBOX }}
        run: |
          # bash -e: a failed exchange stops here, before anything is saved
          python -m tb.pinterest_token "$RUNNER_TEMP/pin_access" "$RUNNER_TEMP/pin_refresh"
          [ -s "$RUNNER_TEMP/pin_access" ] && [ -s "$RUNNER_TEMP/pin_refresh" ] || { echo "::error::no tokens written"; exit 1; }
          echo "::add-mask::$(cat "$RUNNER_TEMP/pin_access")"
          echo "::add-mask::$(cat "$RUNNER_TEMP/pin_refresh")"
      - name: Save them as PINTEREST_TOKEN and PINTEREST_REFRESH_TOKEN
        if: steps.c.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          # refresh token first: it is the one that cannot be recovered without reconnecting
          for i in 1 2 3 4; do
            gh secret set PINTEREST_REFRESH_TOKEN --repo "${GITHUB_REPOSITORY}" < "$RUNNER_TEMP/pin_refresh" && break
            [ "$i" = 4 ] && { echo "::error::could not save the new refresh token; reconnect Pinterest (README)"; exit 1; }
            sleep $((i * 10))
          done
          gh secret set PINTEREST_TOKEN --repo "${GITHUB_REPOSITORY}" < "$RUNNER_TEMP/pin_access"
          rm -f "$RUNNER_TEMP/pin_access" "$RUNNER_TEMP/pin_refresh"
          echo "Pinterest tokens saved"
