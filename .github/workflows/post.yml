name: post-deals

on:
  schedule:
    # GitHub delays and sometimes DROPS scheduled runs (none of the 5 triggers on 2026-10-30 fired), so each
    # slot has 3 triggers ~20 min apart; scheduled runs pass --min-gap-hours 3, so only the first one that fires posts.
    # Backups sit away from :00, where GitHub's scheduler is most congested.
    - cron: "37 4 * * *"   # 10:07 IST
    - cron: "49 4 * * *"   #   backup
    - cron: "23 5 * * *"   #   backup
    - cron: "37 8 * * *"   # 14:07 IST
    - cron: "49 8 * * *"   #   backup
    - cron: "23 9 * * *"   #   backup
    - cron: "7 14 * * *"   # 19:37 IST, also an Instagram feed post (any trigger in hour 14 UTC)
    - cron: "28 14 * * *"  #   backup
    - cron: "53 14 * * *"  #   backup
  workflow_dispatch:
    inputs:
      ig_feed:
        description: "Also publish an Instagram feed post"
        type: boolean
        default: false
      guard:
        description: "Skip if something was posted in the last 3 hours (set by external timers, so they never double-post)"
        type: boolean
        default: false
      check:
        description: "Post nothing; only verify the secrets work (run after adding or changing one)"
        type: boolean
        default: false
      test_reel:
        description: "Post nothing; render a Reel and upload it unpublished (Instagram) / as a deleted draft (Facebook)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-deals
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # pinned to commit SHAs: this job holds the posting secrets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # branch tip at job start, not the trigger-time SHA: a run queued behind another (concurrency group) must
          # see the state/posted.json that run pushed, or --min-gap-hours reads stale state and the deal posts twice
          ref: ${{ github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chrome present (renders the cards)
        run: google-chrome --version
      - name: Install ffmpeg (Reels; not preinstalled on ubuntu-24.04 runners)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: Post next deal
        id: post
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REELS: "1"
          REEL_MUSIC: "1"
        run: python -m tb.main ${{ inputs.check && '--check-channels' || '' }} ${{ inputs.test_reel && '--test-reel' || '' }} ${{ (github.event_name == 'schedule' || inputs.guard) && '--min-gap-hours 3' || '' }} ${{ ((github.event_name == 'schedule' && endsWith(github.event.schedule, ' 14 * * *')) || inputs.ig_feed) && '--ig-feed' || '' }}
      - name: Save posting state (rebase onto any newer push, retry)
        if: always()
        run: |
          git config user.name "trendybehna-bot"
          git config user.email "trendybehna-bot@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "state: posted $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push state/posted.json; the next run may repost this deal"
          exit 1
      - name: Fail the run if posting failed (GitHub emails the repo owner)
        if: steps.post.outcome == 'failure'
        run: exit 1
      - name: Queue running low? (fails with fewer than 6 deals left, about 2 days, so GitHub emails a refill warning)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m tb.main --check-queue 6
